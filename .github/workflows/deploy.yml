# Pubblica il sito su GitHub Pages a ogni push su main (e a mano dalla scheda Actions).
# Il sito finisce su https://<utente>.github.io/<nome-repository>/: il build riceve quel
# percorso come `base`, così link e risorse funzionano anche se il repository viene rinominato.
name: Deploy su GitHub Pages

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

# Un solo deploy alla volta; quello in corso non viene interrotto.
concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci

            - run: npm run build -- --base=/${{ github.event.repository.name }}/

            # GitHub Pages risponde con 404.html ai percorsi che non esistono come file (es. /sylva-estates/ville):
            # è una copia della pagina, così il router dell'app apre la pagina giusta anche da un link diretto.
            - run: cp dist/index.html dist/404.html

            - uses: actions/upload-pages-artifact@v4
              with:
                  path: dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
